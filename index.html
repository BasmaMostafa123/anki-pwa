<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f5bea">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cards</title>
<style>
:root{--bg:#f2f4f8;--panel:#fff;--ink:#1d2433;--mute:#6b7487;--line:#dfe3ec;--acc:#2f5bea;--acc-ink:#fff;--bad:#d64545;--ok:#1f9d63}
@media(prefers-color-scheme:dark){:root{--bg:#10141c;--panel:#1a2030;--ink:#e8ecf5;--mute:#8d97ad;--line:#2a3247;--acc:#6b8cff;--acc-ink:#0b1020;--bad:#ff7a7a;--ok:#4cd08e}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
h1{font-size:26px;margin:8px 0 16px;letter-spacing:-.02em}
h2{font-size:20px;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 14px;cursor:pointer}
button.p{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.d{color:var(--bad)}
button.t{border:0;background:none;color:var(--acc);padding:8px 4px}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:10px 12px}
textarea{min-height:76px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}.row>.fit{flex:none}
.deck{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.deck .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:0;font-weight:600}
.deck small,.mute{color:var(--mute)}
.deck .nm small{display:block;font-weight:400}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px 0}
.box label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
.item{display:flex;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.item .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.item .tx div:last-child{color:var(--mute)}
.study{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 20px;min-height:260px;display:flex;flex-direction:column;justify-content:center;gap:16px;text-align:center}
.big{font-size:28px;white-space:pre-wrap;overflow-wrap:anywhere}
.ans{border-top:1px solid var(--line);padding-top:16px}
.rate{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.rate button{padding:14px 4px;font-size:18px;display:flex;flex-direction:column;gap:2px;font-weight:600}
.rate small{font-weight:400;color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.empty{text-align:center;color:var(--mute);padding:28px 8px}
.rate .no{color:var(--bad)}.rate .yes{color:var(--ok)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const KEY='anki-lite-v1',NEW_LIMIT=20;
let S={decks:[],cards:[],newToday:{}};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.decks)S=r}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert('Could not save. Storage may be full or blocked.')}};
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const day=()=>new Date().toDateString();
const DAY=864e5;
let v={n:'home'},edit=null,st=null;

/* ---------- scheduler (SM-2 style) ---------- */
function schedule(c,right,missed){
  const now=Date.now();
  if(!right)return{ivl:0,reps:0,lapses:c.lapses+1,due:now+6e4};
  const ivl=Math.max(1,missed?1:c.reps===0?1:c.reps===1?3:Math.round(c.ivl*2.2));
  return{ivl,reps:missed?1:c.reps+1,lapses:c.lapses,due:now+ivl*DAY};
}
function lab(c,missed){
  const d=schedule(c,true,missed).ivl;
  return d<30?d+'d':d<365?(d/30).toFixed(1)+'mo':(d/365).toFixed(1)+'y';
}
function counts(id){
  const cs=S.cards.filter(c=>c.d===id),now=Date.now();
  const due=cs.filter(c=>!c.n&&c.due<=now).length;
  const used=S.newToday[id+'|'+day()]||0;
  const nw=Math.min(cs.filter(c=>c.n).length,Math.max(0,NEW_LIMIT-used));
  return{due,nw,total:cs.length};
}

/* ---------- views ---------- */
function render(){
  const a=$('#app');
  if(v.n==='home')a.innerHTML=home();
  else if(v.n==='deck')a.innerHTML=deckView();
  else a.innerHTML=studyView();
  const f=$('#f');if(f&&v.n==='deck'&&edit)f.focus();
}
function home(){
  const rows=S.decks.map(d=>{const c=counts(d.id);return`<div class="deck">
    <button class="nm" data-a="open" data-id="${d.id}">${esc(d.name)}<small>${c.due} due, ${c.nw} new, ${c.total} total</small></button>
    <button class="p" data-a="study" data-id="${d.id}" ${c.due+c.nw?'':'disabled'}>Study</button></div>`}).join('');
  return`<h1>My decks</h1>${rows||'<div class="empty">No decks yet. Create your first one below.</div>'}
  <div class="box"><div class="row"><input id="dn" placeholder="New deck name" maxlength="60"><button class="p fit" data-a="addDeck">Add deck</button></div></div>
  <div class="row" style="margin-top:20px"><button data-a="exportAll">Export backup</button><button data-a="importAll">Import backup</button></div>
  <input type="file" id="fb" accept=".json,application/json" hidden>`;
}
function deckView(){
  const d=S.decks.find(x=>x.id===v.id);if(!d){v={n:'home'};return home()}
  const cs=S.cards.filter(c=>c.d===d.id),c=counts(d.id);
  const e=edit?S.cards.find(x=>x.id===edit):null;
  return`<div class="top"><button class="t" data-a="home">&larr; Decks</button><button class="p" data-a="study" data-id="${d.id}" ${c.due+c.nw?'':'disabled'}>Study ${c.due+c.nw}</button></div>
  <h2>${esc(d.name)}</h2><div class="mute">${c.due} due, ${c.nw} new, ${c.total} total</div>
  <div class="box"><label for="f">Front</label><textarea id="f">${e?esc(e.f):''}</textarea>
  <label for="b">Back</label><textarea id="b">${e?esc(e.b):''}</textarea>
  <div class="row" style="margin-top:10px"><button class="p" data-a="saveCard">${e?'Save changes':'Add card'}</button>${e?'<button data-a="cancelEdit">Cancel</button>':''}</div></div>
  ${cs.length?cs.slice().reverse().map(x=>`<div class="item"><div class="tx"><div>${esc(x.f)}</div><div>${esc(x.b)}</div></div>
    <button class="t" data-a="editCard" data-id="${x.id}">Edit</button><button class="t d" data-a="delCard" data-id="${x.id}">Delete</button></div>`).join(''):'<div class="empty">No cards yet. Add one above.</div>'}
  <div class="row" style="margin-top:20px;flex-wrap:wrap"><button data-a="importCsv">Import CSV/TSV</button></div>
  <div class="row" style="margin-top:8px"><button data-a="renameDeck">Rename deck</button><button class="d" data-a="delDeck">Delete deck</button></div>
  <input type="file" id="fc" accept=".csv,.tsv,.txt,text/plain,text/csv" hidden>`;
}
function studyView(){
  const c=S.cards.find(x=>x.id===st.q[0]);
  if(!c)return`<div class="top"><button class="t" data-a="open" data-id="${v.id}">&larr; Back</button></div>
    <div class="study"><div class="big">All done</div><div class="mute">${st.done} cards reviewed. Come back later for more.</div></div>`;
  return`<div class="top"><button class="t" data-a="open" data-id="${v.id}">&larr; Exit</button><span class="mute">${st.q.length} left</span></div>
  <div class="study"><div class="big">${esc(c.f)}</div>${st.show?`<div class="ans"><div class="big">${esc(c.b)}</div></div>`:''}</div>
  ${st.show?`<div class="rate"><button class="no" data-a="rate" data-id="no">Wrong<small>repeat now</small></button><button class="yes" data-a="rate" data-id="yes">Right<small>next: ${lab(c,!!st.miss[c.id])}</small></button></div>`
  :`<div style="margin-top:14px"><button class="p" style="width:100%;padding:14px" data-a="reveal">Show answer</button></div>`}`;
}

/* ---------- actions ---------- */
const A={
  home(){v={n:'home'};edit=null;render()},
  open(id){v={n:'deck',id};edit=null;render()},
  addDeck(){const n=$('#dn').value.trim();if(!n)return;S.decks.push({id:uid(),name:n});save();render()},
  renameDeck(){const d=S.decks.find(x=>x.id===v.id),n=prompt('Deck name',d.name);if(n&&n.trim()){d.name=n.trim();save();render()}},
  delDeck(){const d=S.decks.find(x=>x.id===v.id);if(!confirm(`Delete "${d.name}" and all its cards?`))return;
    S.decks=S.decks.filter(x=>x.id!==d.id);S.cards=S.cards.filter(c=>c.d!==d.id);save();A.home()},
  saveCard(){const f=$('#f').value.trim(),b=$('#b').value.trim();if(!f||!b){alert('Fill in both front and back.');return}
    if(edit){const c=S.cards.find(x=>x.id===edit);c.f=f;c.b=b;edit=null}
    else S.cards.push({id:uid(),d:v.id,f,b,n:1,due:0,ivl:0,ease:2.5,reps:0,lapses:0});
    save();render();$('#f').focus()},
  editCard(id){edit=id;render();scrollTo(0,0)},
  cancelEdit(){edit=null;render()},
  delCard(id){if(confirm('Delete this card?')){S.cards=S.cards.filter(c=>c.id!==id);save();render()}},
  study(id){
    const now=Date.now(),cs=S.cards.filter(c=>c.d===id);
    const due=cs.filter(c=>!c.n&&c.due<=now).sort((a,b)=>a.due-b.due);
    const left=Math.max(0,NEW_LIMIT-(S.newToday[id+'|'+day()]||0));
    const nw=cs.filter(c=>c.n).slice(0,left);
    v={n:'study',id};st={q:[...due,...nw].map(c=>c.id),show:false,done:0,miss:{}};render();
  },
  reveal(){st.show=true;render()},
  rate(x){
    const right=x==='yes',id=st.q.shift(),c=S.cards.find(k=>k.id===id);
    if(c.n){c.n=0;const k=c.d+'|'+day();S.newToday[k]=(S.newToday[k]||0)+1}
    Object.assign(c,schedule(c,right,!!st.miss[id]));
    if(right)st.done++;else{st.miss[id]=1;st.q.push(id)}
    st.show=false;save();render();
  },
  exportAll(){const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));
    a.download='cards-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()},
  importAll(){$('#fb').click()},
  importCsv(){$('#fc').click()}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset.id||b.dataset.t)});
document.addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    if(e.target.id==='fb'){
      try{const j=JSON.parse(rd.result);if(!j.decks||!j.cards)throw 0;
        if(confirm('Replace all current data with this backup?')){S=j;S.newToday=S.newToday||{};save();A.home()}}
      catch(x){alert('That file is not a valid backup.')}
    }else if(e.target.id==='fc'){
      let n=0;rd.result.split(/\r?\n/).forEach(l=>{
        if(!l.trim())return;const i=l.includes('\t')?l.indexOf('\t'):l.indexOf(',');if(i<1)return;
        const fr=l.slice(0,i).trim().replace(/^"|"$/g,''),bk=l.slice(i+1).trim().replace(/^"|"$/g,'');
        if(fr&&bk){S.cards.push({id:uid(),d:v.id,f:fr,b:bk,n:1,due:0,ivl:0,ease:2.5,reps:0,lapses:0});n++}});
      save();render();alert(n+' cards imported.');
    }
  };
  rd.readAsText(f);e.target.value='';
});
document.addEventListener('keydown',e=>{
  if(v.n!=='study'||!st||/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(!st.show&&(e.key===' '||e.key==='Enter')){e.preventDefault();A.reveal()}
  else if(st.show&&(e.key==='1'||e.key==='2'))A.rate(e.key==='1'?'no':'yes');
});
render();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
